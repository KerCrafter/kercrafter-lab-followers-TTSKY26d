# Vérifie que la ROM générée correspond à followers.txt (évite une ROM modifiée à la main).
name: ROM des followers à jour
on: [push, pull_request, workflow_dispatch]
jobs:
  rom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --quiet pillow && python scripts/followers.py check
